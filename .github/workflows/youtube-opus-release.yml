name: YouTube Playlist -> Opus (No Login / No Zip)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTubeプレイリストURL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          python -m pip install -U https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.tar.gz
          python -m pip install -U bgutil-ytdlp-pot-provider
          mkdir -p audio .yt-dlp-cache
          touch .yt-dlp-cache/archive.txt
          yt-dlp --version
          ffmpeg -version

      - name: Download - Opus best quality (no login)
        run: |
          yt-dlp \
            --extractor-args "youtube:player_client=android,ios,mweb,web;po_token=auto" \
            --extractor-args "youtubepot:bgutil:enable=true" \
            --sleep-requests 1 --sleep-interval 2 --sleep-subtitles 1 \
            --ignore-errors \
            --retries 10 --fragment-retries 10 --concurrent-fragments 4 \
            -f "bestaudio[acodec=opus]/bestaudio/best" \
            -x --audio-format opus --audio-quality 0 \
            --embed-metadata --embed-thumbnail --embed-chapters \
            --download-archive .yt-dlp-cache/archive.txt \
            -o "audio/%(playlist_index)03d - %(title)s [%(id)s].%(ext)s" \
            "${{ inputs.playlist_url }}"
          ls -lh audio

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opus-${{ github.run_number }}
          name: opus-${{ github.run_number }}
          body: Source ${{ inputs.playlist_url }} / no-login auto PO token
          files: audio/*.opus
